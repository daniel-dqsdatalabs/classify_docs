[project]
name = "classify-docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Q.", email = "daniel@dqsdatalabs.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.130.0",
    "laya>=0.3.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
classify-docs = "classify_docs:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
